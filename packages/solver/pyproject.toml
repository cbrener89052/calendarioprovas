[project]
name = "calendarioprovas-solver"
version = "0.2.0"
description = "Solver Proposta 3 — wrapper importável do legado (T5)"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "../ingest", "../../.."]
markers = [
    "slow: testes end-to-end com geração completa",
]
