[project]
name = "calendarioprovas-ingest"
version = "0.1.0"
description = "Extração e check-in de grade horária (T3c)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
ingest-checkin = "ingest.checkin:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingest*"]
