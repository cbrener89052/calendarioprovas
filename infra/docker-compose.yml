# calendarioprovas — infra local

# Uso: docker compose -f infra/docker-compose.yml config
#      docker compose -f infra/docker-compose.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calendario
      POSTGRES_PASSWORD: calendario
      POSTGRES_DB: calendario
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendario -d calendario"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://calendario:calendario@postgres:5432/calendario
      BLOB_ENDPOINT: http://minio:9000
      BLOB_ROOT: /data/blobs
    volumes:
      - apiblobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../apps/worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://calendario:calendario@postgres:5432/calendario
      BLOB_ENDPOINT: http://minio:9000
      WORKER_POLL_INTERVAL: "10"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  apiblobs:
